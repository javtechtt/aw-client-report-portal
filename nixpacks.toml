# Nixpacks build config for Railway.
#
# WeasyPrint depends on the GTK runtime libraries (pango, cairo, gdk-pixbuf,
# ffi) plus shared-mime-info and a base font set. Railway's stock Python
# Nixpacks image does NOT include these, so without this file PDF downloads
# would serve the friendly fallback page (HTTP 503) instead of real PDFs.
#
# Verify after deploy with:  curl -sI <app>/reports/<id>/sacs.pdf
# A working install returns:  Content-Type: application/pdf
# A missing-libs install:     HTTP/2 503 + the _pdf_unavailable fallback HTML
[phases.setup]
aptPkgs = [
    "libpango-1.0-0",
    "libpangoft2-1.0-0",
    "libcairo2",
    "libgdk-pixbuf-2.0-0",
    "libffi-dev",
    "shared-mime-info",
    "fonts-liberation",
]
